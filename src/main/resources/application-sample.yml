# ===================================================================
#                      生产环境 (Production) 示例配置
# ===================================================================
spring:
  application:
    name: ai-code-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://your-mysql-host:3306/your-db-name
    username: your-db-username
    password: <YOUR_DATABASE_PASSWORD>
  # redis
  data:
    redis:
      host: your-redis-host
      port: 6379
      password: <YOUR_REDIS_PASSWORD>
      database: 0
      ttl: 3600
      timeout: 5000ms
      client-type: jedis
      jedis:
        pool:
          max-active: 8
          max-wait: 5000ms
          max-idle: 4
          min-idle: 0
          time-between-eviction-runs: -1
          min-evictable-idle-time: 60000ms
          block-when-exhausted: false
          jmx-enabled: false
          test-on-borrow: false
          test-while-idle: false

  # 邮箱配置 (腾讯云邮件推送)
  mail:
    host: gz-smtp.qcloudmail.com
    port: 465
    username: your-email@example.com # 腾讯云邮件推送的SMTP用户名
    password: <YOUR_EMAIL_SMTP_PASSWORD> # 腾讯云邮件推送的SMTP密码
    from: your-verified-sender@example.com # 在腾讯云验证过的发信地址
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
  # session 配置
  session:
    store-type: redis
    timeout: 2592000

server:
  port: 8101
  servlet:
    context-path: /example
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ran.aicode.controller

# 接口文档配置 (生产环境建议关闭)
knife4j:
  setting:
    language: zh_cn
  basic:
    enable: false
    username: admin
    password: <YOUR_KNIFE4J_PASSWORD>

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <YOUR_DASHSCOPE_API_KEY>
      #base-url: https://api.siliconflow.cn/v1
      #api-key: <YOUR_SILICONFLOW_API_KEY>
      #model-name: qwen3-coder-plus
      model-name: qwen-turbo
      max-tokens: 2048
      log-requests: false
      log-responses: false

    streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <YOUR_DASHSCOPE_API_KEY>
      #model-name: qwen3-coder-plus
      model-name: qwen-turbo
      max-tokens: 4096
      log-requests: false
      log-responses: false

    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <YOUR_DASHSCOPE_API_KEY>
      
      # ========== 当前使用的模型（最便宜最快） ==========
      #model-name: qwen-turbo                          # ⭐⭐⭐⭐⭐ 最便宜最快选择
      #model-name: qwen-flash-2025-07-28              # ⭐⭐⭐⭐ 便宜快速
      #model-name: qwen-flash                         # ⭐⭐⭐⭐ 便宜快速
      model-name: qwen-coder-turbo-0919                     # ⭐⭐⭐⭐⭐ 代码专用最便宜选择

      # ========== 超便宜梯队：极致性价比（价格优先） ==========
      #model-name: qwen-turbo                         # ⭐⭐⭐⭐⭐ 最便宜最快
      #model-name: qwen-coder-turbo                   # ⭐⭐⭐⭐⭐ 代码专用最便宜
      #model-name: qwen-flash                         # ⭐⭐⭐⭐ 便宜快速
      #model-name: deepseek-v3                        # ⭐⭐⭐⭐ 便宜基础功能
      #model-name: qwen3-coder-flash                  # ⭐⭐⭐⭐ 代码专用便宜版
      
      # ========== 便宜梯队：性价比选择（平衡价格和性能） ==========
      #model-name: qwen-plus                          # ⭐⭐⭐ 便宜稳定
      #model-name: deepseek-v3.1                      # ⭐⭐⭐ 便宜高性能
      #model-name: qwen3-coder-plus                   # ⭐⭐⭐ 代码专用便宜版
      
      # ========== 中等梯队：性能提升（性能优先） ==========
      #model-name: qwen-max                           # ⭐⭐ 成熟稳定但较贵
      #model-name: qwen3-30b-a3b                      # ⭐⭐ 高性能但较贵
      #model-name: deepseek-r1                        # ⭐⭐ 最强推理但较贵
      
      # ========== 高端梯队：最强性能（性能优先） ==========
      #model-name: qwen3-next-80b-a3b-thinking        # ⭐ 最佳平衡但很贵
      #model-name: qwen3-235b-a22b-thinking-2507       # ⭐ 高性能但很贵
      #model-name: qwen3-235b-a22b-instruct-2507      # ⭐ 高性能但很贵
      #model-name: qwen3-235b-a22b                    # ⭐ 高性能但很贵

      #max-tokens: 32768
      max-tokens: 8192
    
      temperature: 0.1
      # log-requests: true
      # log-responses: true
      log-requests: false
      log-responses: false

    # 智能路由 AI 模型配置
    # 用于判断用户需求应该使用哪种代码生成类型（HTML/MULTI_FILE/VUE_PROJECT）
    # 使用轻量级快速模型，只需返回枚举值，不需要复杂推理
    routing-chat-model:
      base-url: https://api-inference.modelscope.cn/v1
      api-key: <YOUR_MODELSCOPE_API_KEY>
      model-name: Qwen/Qwen3-4B
      max-tokens: 100
      log-requests: false
      log-responses: false

      # 多级保底模型配置（可选）
      # 当主模型调用失败时，会自动切换到次级保底模型，再失败则切换到终极保底模型
      fallbacks:
        enabled: false               # 默认关闭，需要时手动开启
        recovery-interval-minutes: 30

        # 次级保底模型（推荐使用 ModelScope）
        # 注意：避免使用智谱 GLM 作为非流式模型的保底
        # 原因：智谱 GLM API 要求非流式调用时 enable_thinking=false，与 LangChain4j 存在兼容性问题
        secondary:
          enabled: false
          base-url: https://api-inference.modelscope.cn/v1
          api-key: <YOUR_MODELSCOPE_API_KEY>
          model-name: Qwen/Qwen2.5-Coder-7B-Instruct
          max-tokens: 128
          timeout-ms: 30000
          log-requests: false
          log-responses: false

        # 终极保底模型（推荐使用 ModelScope）
        # 注意：避免使用阿里云作为保底，免费额度容易耗尽
        tertiary:
          enabled: false
          base-url: https://api-inference.modelscope.cn/v1
          api-key: <YOUR_MODELSCOPE_API_KEY>
          model-name: Qwen/Qwen2.5-Coder-14B-Instruct
          max-tokens: 128
          timeout-ms: 60000
          log-requests: false
          log-responses: false

# 华为云 OBS 对象存储配置
obs:
  client:
    host: https://your-bucket-name.obs.cn-north-4.myhuaweicloud.com
    endpoint: obs.cn-north-4.myhuaweicloud.com
    accessKey: <YOUR_OBS_ACCESS_KEY>
    secretKey: <YOUR_OBS_SECRET_KEY>
    bucket: your-obs-bucket-name

# Sa-Token 配置
sa-token:
  token-name: ai-code-token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

# 阿里云 DashScope 配置
dashscope:
  api-key: <YOUR_DASHSCOPE_API_KEY>
  image-model: wan2.2-t2i-flash

# 腾讯云 API 配置
tencent:
  secret-id: <YOUR_TENCENT_CLOUD_SECRET_ID> # 请替换为你的腾讯云SecretId
  secret-key: <YOUR_TENCENT_CLOUD_SECRET_KEY> # 请替换为你的腾讯云SecretKey
  ses:
    region: ap-guangzhou # 邮件服务地域，例如 ap-guangzhou
    template-id: 35831 # 请替换为你在腾讯云创建的邮件模板ID

# Pexels 图片搜索配置
pexels:
  api-key: <YOUR_PEXELS_API_KEY>

# 生产环境关闭SQL日志
mybatis-flex:
  configuration:
    log-impl: ''

# 热 key 探测
hotkey:
  app-name: Ai-codegen
  caffeine-size: 10000
  push-period: 1000
  etcd-server: http://your-etcd-host:2379

# 部署路径
code:
  deploy-host: http://localhost/dist

logging:
  level:
    "[org.springframework.boot.context.properties]": DEBUG
    "[com.jd.platform.hotkey]": ERROR
