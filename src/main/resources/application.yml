# ===================================================================
#                      基础通用 (Base) 配置
# ===================================================================
spring:
  application:
    name: ai-code-backend
  profiles:
    # 在这里切换环境 (prod, dev, local)
    active: prod

  # redis
  data:
    redis:
      database: 0
      ttl: 3600
      timeout: 5000ms
      client-type: jedis
      jedis:
        pool:
          max-active: 8
          max-wait: 5000ms
          max-idle: 4
          min-idle: 0
          time-between-eviction-runs: -1
          min-evictable-idle-time: 60000ms
          block-when-exhausted: false
          jmx-enabled: false
          test-on-borrow: false
          test-while-idle: false

  # 邮箱通用配置
  mail:
    host: smtp.163.com
    properties:
      mail:
        smtp:
          ssl:
            enable: true
  # session 配置
  session:
    store-type: redis
    timeout: 2592000

server:
  servlet:
    context-path: /example
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ran.aicode.controller

# 接口文档配置
knife4j:
  setting:
    language: zh_cn
  basic:
    username: root
    password: 868686

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.siliconflow.cn/v1/chat/completions
      model-name: deepseek-ai/DeepSeek-V3.1
      max-tokens: 8192
    streaming-chat-model:
      base-url: https://api.siliconflow.cn/v1/chat/completions
      model-name: deepseek-ai/DeepSeek-V3.1
      max-tokens: 8192
    reasoning-streaming-chat-model:
      base-url: https://api.siliconflow.cn/v1/chat/completions
      model-name: Pro/deepseek-ai/DeepSeek-V3.1
      max-tokens: 32768
      temperature: 0.1
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen-turbo
      max-tokens: 100

# 华为云 OBS 对象存储配置
obs:
  client:
    endpoint: obs.cn-north-4.myhuaweicloud.com
    bucket: your-obs-bucket

# Sa-Token 配置
sa-token:
  token-name: ai-code-token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

# 阿里云 DashScope 配置
dashscope:
  image-model: wan2.2-t2i-flash

# 热 key 探测
hotkey:
  app-name: Ai-codegen
  caffeine-size: 10000
  push-period: 1000
