# ===================================================================
#                      生产环境 (Production) 示例配置
# ===================================================================
spring:
  application:
    name: ai-code-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://your-mysql-host:3306/your-db-name
    username: your-db-username
    password: <YOUR_DATABASE_PASSWORD>
  # redis
  data:
    redis:
      host: your-redis-host
      port: 6379
      password: <YOUR_REDIS_PASSWORD>
      database: 0
      ttl: 3600
      timeout: 5000ms
      client-type: jedis
      jedis:
        pool:
          max-active: 8
          max-wait: 5000ms
          max-idle: 4
          min-idle: 0
          time-between-eviction-runs: -1
          min-evictable-idle-time: 60000ms
          block-when-exhausted: false
          jmx-enabled: false
          test-on-borrow: false
          test-while-idle: false

  # 邮箱配置 
  #腾讯云邮箱推送服务
  mail:
    host: gz-smtp.qcloudmail.com
    port: 465
    username: your-email@example.com
    password: <YOUR_EMAIL_PASSWORD>
    emailFrom: your-email@example.com
    properties:
      mail:
        smtp:
          ssl:
            enable: true
  # session 配置
  session:
    store-type: redis
    timeout: 2592000

server:
  port: 8101
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ran.aicode.controller

# 接口文档配置 (生产环境建议关闭)
knife4j:
  setting:
    language: zh_cn
  basic:
    enable: false
    username: admin
    password: <YOUR_KNIFE4J_PASSWORD>

# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.siliconflow.cn/v1/chat/completions
      api-key: <YOUR_SILICONFLOW_API_KEY>
      model-name: deepseek-ai/DeepSeek-V3.1
      max-tokens: 8192
      log-requests: false
      log-responses: false
    streaming-chat-model:
      base-url: https://api.siliconflow.cn/v1/chat/completions
      api-key: <YOUR_SILICONFLOW_API_KEY>
      model-name: deepseek-ai/DeepSeek-V3.1
      max-tokens: 8192
      log-requests: false
      log-responses: false
    reasoning-streaming-chat-model:
      base-url: https://api.siliconflow.cn/v1/chat/completions
      api-key: <YOUR_SILICONFLOW_API_KEY>
      model-name: Pro/deepseek-ai/DeepSeek-V3.1
      max-tokens: 32768
      temperature: 0.1
      log-requests: false
      log-responses: false
    routing-chat-model:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: <YOUR_DASHSCOPE_API_KEY>
      model-name: qwen-turbo
      max-tokens: 100
      log-requests: false
      log-responses: false

# 华为云 OBS 对象存储配置
obs:
  client:
    endpoint: obs.cn-north-4.myhuaweicloud.com
    accessKey: <YOUR_OBS_ACCESS_KEY>
    secretKey: <YOUR_OBS_SECRET_KEY>
    bucket: your-obs-bucket-name

# Sa-Token 配置
sa-token:
  token-name: ai-code-token
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: true

# 阿里云 DashScope 配置
dashscope:
  api-key: <YOUR_DASHSCOPE_API_KEY>
  image-model: wan2.2-t2i-flash

# Pexels 图片搜索配置
pexels:
  api-key: <YOUR_PEXELS_API_KEY>

# 生产环境关闭SQL日志
mybatis-flex:
  configuration:
    log-impl: ''

# 热 key 探测
hotkey:
  app-name: Ai-codegen
  caffeine-size: 10000
  push-period: 1000
  etcd-server: http://your-etcd-host:2379

# 部署路径
code:
  deploy-host: http://your-deploy-host/dist